<section class="mx-auto max-w-md rounded-xl border border-slate-200 bg-white p-8 shadow-sm">
  <h1 class="mb-6 text-3xl font-bold text-slate-800">สมัครสมาชิก</h1>
  <p class="mb-6 text-slate-600">สร้างบัญชีเพื่อใช้งานระบบ</p>

  <form class="space-y-4">
    <div>
      <label class="mb-2 block text-sm font-medium text-slate-700">ชื่อ</label>
      <input type="text" class="w-full rounded-lg border border-slate-300 px-3 py-2 outline-none ring-0 focus:border-sky-500" placeholder="กรอกชื่อ" />
    </div>
    <div>
      <label class="mb-2 block text-sm font-medium text-slate-700">อีเมล</label>
      <input type="email" class="w-full rounded-lg border border-slate-300 px-3 py-2 outline-none ring-0 focus:border-sky-500" placeholder="กรอกอีเมล" />
    </div>
    <div>
      <label class="mb-2 block text-sm font-medium text-slate-700">รหัสผ่าน</label>
      <input type="password" class="w-full rounded-lg border border-slate-300 px-3 py-2 outline-none ring-0 focus:border-sky-500" placeholder="กรอกรหัสผ่าน" />
    </div>
    <button type="button" class="w-full rounded-lg bg-sky-600 px-4 py-2 text-white transition hover:bg-sky-700">สมัครสมาชิก</button>
  </form>

  <p class="mt-6 text-center text-sm text-slate-600">
    มีบัญชีแล้ว?
    <a routerLink="/login" class="font-semibold text-sky-700 hover:text-sky-800">เข้าสู่ระบบ</a>
  </p>
</section>
